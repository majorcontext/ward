name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: temporary timing probe
        run: |
          go test -race -count=1 -json ./cmd/ward > /tmp/all.json || true
          python3 - <<'PY'
          import json
          t = {}
          pkg = 0
          for line in open('/tmp/all.json'):
              try: e = json.loads(line)
              except Exception: continue
              if e.get('Action') in ('pass', 'fail'):
                  if e.get('Test'): t[e['Test']] = e.get('Elapsed', 0)
                  else: pkg = e.get('Elapsed', 0)
          tops = {k: v for k, v in t.items() if '/' not in k}
          print('PROBE package', pkg, 'tests', len(tops), 'sum', round(sum(tops.values()), 2))
          for k, v in sorted(tops.items(), key=lambda kv: -kv[1]): print('PROBE', round(v, 2), k)
          PY
          echo PROBE land-only; go test -race -count=1 -run 'TestLand|TestResult|TestRunner' ./cmd/ward | sed 's/^/PROBE /'
          echo PROBE mirror-only; go test -race -count=1 -run 'TestMirror|TestSeed' ./cmd/ward | sed 's/^/PROBE /'
          go test -race -count=1 -c -o /tmp/ward.test ./cmd/ward
          cd cmd/ward && /tmp/ward.test -test.count=1 -test.cpuprofile /tmp/cpu.prof > /dev/null 2>&1; cd ../..
          go tool pprof -top -cum -nodecount=45 /tmp/ward.test /tmp/cpu.prof 2>&1 | sed 's/^/PROBE /'
      - run: go build ./...
      - run: go vet ./...
      - run: go run ./internal/lint/cmd/lint ./...
      # testtime prints the test log and fails a test or a package over testdata/test-time-budget.txt.
      - run: |
          set -o pipefail
          go test -race -count=1 -json ./... | go run ./internal/testtime -title Unit -job go
      - run: test -z "$(gofmt -l .)"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: |
          test "v$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/ward/Chart.yaml)" = "$GITHUB_REF_NAME"
      - run: helm lint charts/ward -f charts/ward/ci/values.yaml
      - run: helm lint charts/ward -f charts/ward/ci/no-mirrors.yaml
      - run: helm template ward charts/ward -f charts/ward/ci/values.yaml > /dev/null
      - run: helm template ward charts/ward -f charts/ward/ci/no-mirrors.yaml > /dev/null
      - run: |
          helm template ward charts/ward -f charts/ward/ci/values.yaml | grep -A1 WARD_MIRRORS | grep -q github_app
      - run: |
          helm template ward charts/ward -f charts/ward/ci/values.yaml | grep -A1 WARD_RUNNERS | grep -q secret_file
      - run: |
          ! helm template ward charts/ward -f charts/ward/ci/no-mirrors.yaml --set 'mirrors[0].name=m' --set 'mirrors[0].repo=native:r' --set 'mirrors[0].remote=https://h/r.git' --set 'mirrors[0].refs={main}' --set publicUrl=http://w --set hookSecret.name=h
      - run: |
          ! helm template ward charts/ward -f charts/ward/ci/values.yaml --set trustedKeysSecret.name=x

  leak:
    # A fork pull request gets no secrets, so the job cannot run for it.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/leaklint
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
