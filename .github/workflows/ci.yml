name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go run ./internal/lint/cmd/lint ./...
      # testtime prints the test log and fails a test or a package over testdata/test-time-budget.txt.
      - run: |
          set -o pipefail
          go test -race -count=1 -json ./... | go run ./internal/testtime -title Unit -job go
      - run: test -z "$(gofmt -l .)"

  leak:
    # A fork pull request gets no secrets, so the job cannot run for it.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/leaklint
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
