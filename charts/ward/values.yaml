# image is the ward image. Set digest or tag; a digest wins.
image:
  repository: ghcr.io/majorcontext/ward
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  # name defaults to the release name.
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

# listenPort is the container port. It sets WARD_LISTEN.
listenPort: 8080

# publicUrl is the base URL under which motte reaches ward. Required when mirrors is not empty.
publicUrl: ""

# motte says how ward reaches motte. keySecret names the existing Secret that holds the base64 Ed25519 private key
# that signs the grants. The chart creates no Secret.
motte:
  url: ""
  kid: ""
  keySecret:
    name: ""
    key: key

# hookSecret names the existing Secret that holds the subscription secret. Required when mirrors is not empty.
hookSecret:
  name: ""
  key: secret

# trustedKeys is the list of caller public keys. Each entry has kid, key (standard base64 of an Ed25519 public key)
# and scopes (read, operator, land, check, runner). Set trustedKeysSecret to read the JSON list from an existing Secret instead.
# Set at most one of the two.
trustedKeys: []
trustedKeysSecret:
  name: ""
  key: trusted-keys.json

# mirrors lists the mirrors. Each has name, repo, remote, refs, pruneUnknown, seed, username, and exactly one credential:
#   credential: {secret: NAME, key: KEY}                       a file with the password or token of the remote
#   githubApp: {appId: N, installationId: N, secret: NAME, key: KEY}   a PEM RSA private key of a GitHub App
mirrors: []

# runners lists the check runners, one for each repository. Each has repo, kids (the runner identities that may lease its
# checks), optional minIsolation (gvisor by default, or container) and env. env is the environment text of the runner, such as
# an image digest.
runners: []

# githubApiUrl sets WARD_GITHUB_API_URL, for a GitHub Enterprise Server.
githubApiUrl: ""

# cloneDiskBudget (bytes) and cloneIdleTtl (Go duration) set WARD_CLONE_DISK_BUDGET and WARD_CLONE_IDLE_TTL.
cloneDiskBudget: ""
cloneIdleTtl: ""

# persistence is the volume of WARD_DATA_DIR, which holds the SQLite state and the clone cache. ward has one
# writer, so the Deployment has one replica and the strategy Recreate.
persistence:
  size: 30Gi
  storageClassName: ""
  accessModes: [ReadWriteOnce]

# otlpEndpoint enables OTLP trace export when set.
otlpEndpoint: ""

prometheusAnnotations: true

resources:
  requests:
    cpu: 100m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# extraEnv adds environment variables to the container, such as GIT_SSL_CAINFO.
extraEnv: []

# runner deploys `ward runner`, a check runner that runs each check in a sandbox next to ward. It is off by default.
# It polls ward for leases, so it needs no Service. Put its checkKey.kid in the kids of an entry of runners.
runner:
  enabled: false
  # image must hold ward and a container engine, such as the image of images/ward-runner/Dockerfile.
  image:
    repository: ""
    tag: ""
    digest: ""
  # wardUrl defaults to the Service of this release.
  wardUrl: ""
  # checkKey names the existing Secret that holds the base64 Ed25519 private key that signs check and runner tokens. Its public key
  # goes in trustedKeys with the kid below and the scopes check and runner.
  checkKey: {kid: "", name: "", key: key}
  # motte names the Secret that holds a read grant of motte for the repositories to check.
  motte: {url: "", grantSecret: {name: "", key: grant}}
  # sandbox is auto, gvisor or container. auto means gvisor and fails at start without runsc; container is the only weaker choice.
  sandbox: auto
  engine: podman
  # sandboxImage is the OCI image in which each check runs.
  sandboxImage: ""
  network: none
  memory: 4g
  concurrency: 1
  runtimeClassName: ""
  # privileged lets a container engine run inside the pod. Without it, mount an engine socket with extraVolumes.
  privileged: false
  workDirSize: 10Gi
  resources: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
