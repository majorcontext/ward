{{- if .Values.runner.enabled }}
{{- $r := .Values.runner -}}
{{- $_ := required "runner.image.repository is required" $r.image.repository -}}
{{- $_ := required "runner.hookSecret.name is required" $r.hookSecret.name -}}
{{- $_ := required "runner.checkKey.name is required" $r.checkKey.name -}}
{{- $_ := required "runner.checkKey.kid is required" $r.checkKey.kid -}}
{{- $_ := required "runner.motte.url is required" $r.motte.url -}}
{{- $_ := required "runner.motte.grantSecret.name is required" $r.motte.grantSecret.name -}}
{{- $_ := required "runner.sandboxImage is required" $r.sandboxImage -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "ward.runner.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ward.runner.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ward.runner.labels" . | nindent 8 }}
    spec:
      {{- with $r.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      containers:
        - name: runner
          image: {{ if $r.image.digest }}{{ printf "%s@%s" $r.image.repository $r.image.digest }}{{ else }}{{ printf "%s:%s" $r.image.repository (required "runner.image.digest or runner.image.tag is required" $r.image.tag) }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: {{ $r.privileged }}
          ports:
            - name: http
              containerPort: {{ $r.listenPort }}
          env:
            - name: WARD_RUNNER_LISTEN
              value: {{ printf ":%v" $r.listenPort | quote }}
            - name: WARD_RUNNER_WARD_URL
              value: {{ default (printf "http://%s:%v" .Release.Name .Values.service.port) $r.wardUrl | quote }}
            - name: WARD_RUNNER_SECRET_FILE
              value: /var/run/ward-runner/hook/secret
            - name: WARD_RUNNER_KID
              value: {{ $r.checkKey.kid | quote }}
            - name: WARD_RUNNER_KEY_FILE
              value: /var/run/ward-runner/key/key
            - name: WARD_RUNNER_MOTTE_URL
              value: {{ $r.motte.url | quote }}
            - name: WARD_RUNNER_MOTTE_GRANT_FILE
              value: /var/run/ward-runner/grant/grant
            - name: WARD_RUNNER_SANDBOX
              value: {{ $r.sandbox | quote }}
            - name: WARD_RUNNER_ENGINE
              value: {{ $r.engine | quote }}
            - name: WARD_RUNNER_IMAGE
              value: {{ $r.sandboxImage | quote }}
            - name: WARD_RUNNER_NETWORK
              value: {{ $r.network | quote }}
            - name: WARD_RUNNER_MEMORY
              value: {{ $r.memory | quote }}
            - name: WARD_RUNNER_CONCURRENCY
              value: {{ $r.concurrency | quote }}
            - name: WARD_RUNNER_WORK_DIR
              value: /var/lib/ward-runner
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - {name: work, mountPath: /var/lib/ward-runner}
            - {name: hook, mountPath: /var/run/ward-runner/hook, readOnly: true}
            - {name: key, mountPath: /var/run/ward-runner/key, readOnly: true}
            - {name: grant, mountPath: /var/run/ward-runner/grant, readOnly: true}
            {{- with $r.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ $r.workDirSize }}
        - name: hook
          secret:
            secretName: {{ $r.hookSecret.name }}
            items: [{key: {{ $r.hookSecret.key }}, path: secret}]
        - name: key
          secret:
            secretName: {{ $r.checkKey.name }}
            items: [{key: {{ $r.checkKey.key }}, path: key}]
        - name: grant
          secret:
            secretName: {{ $r.motte.grantSecret.name }}
            items: [{key: {{ $r.motte.grantSecret.key }}, path: grant}]
        {{- with $r.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "ward.runner.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ward.runner.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $r.listenPort }}
      targetPort: http
{{- end }}
